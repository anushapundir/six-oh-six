<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>six-oh-six</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="name">six-oh-six</span>
      <span class="tagline">An AI reads a contract and decides when the seller can book the revenue (ASC 606)</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="cases" aria-selected="true">Contracts</button>
      <button role="tab" data-tab="scoreboard" aria-selected="false">Scoreboard</button>
    </nav>
  </header>
  <ol class="howto" id="howto">
    <li><b>1</b> Pick a contract</li>
    <li><b>2</b> See what the AI decided, checked against an answer key</li>
    <li><b>3</b> Click a clause tag like <span class="chip">c-003</span> to see the proof</li>
  </ol>

  <main id="cases" class="view cases-view">
    <aside class="col list-col">
      <h2 class="col-title">Contracts</h2>
      <ul id="case-list" class="case-list"></ul>
    </aside>
    <section class="col contract-col">
      <div id="contract-head" class="contract-head"></div>
      <div class="filter" id="filter"></div>
      <ol id="clauses" class="clauses"></ol>
    </section>
    <section class="col analysis-col">
      <div class="runner-toggle" role="group" aria-label="Who analyzed it">
        <button data-runner="agent" aria-pressed="true">AI agent</button>
        <button data-runner="baseline" aria-pressed="false">Keyword rules</button>
      </div>
      <div id="analysis"></div>
    </section>
  </main>

  <main id="scoreboard" class="view board-view" hidden></main>

  <script src="/static/app.js"></script>
</body>
</html>
